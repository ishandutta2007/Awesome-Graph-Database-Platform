<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Linear Gradients for Edges -->
    <linearGradient id="edge-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="edge-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Pulsing Node Animation -->
    <style>
      .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      .network-edge { stroke-dasharray: 8 4; animation: dash 30s linear infinite; }
      .pulse-node { animation: pulse 3s ease-in-out infinite alternate; }
      .pulse-node-delayed { animation: pulse 3s ease-in-out 1.5s infinite alternate; }
      .float-text { animation: float 4s ease-in-out infinite alternate; }
      
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.7; }
        100% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #00f2fe); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Grid Lines -->
  <g class="bg-grid">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- Dynamic Graph Network Background Connections -->
  <g stroke-width="1.5">
    <!-- Left Network cluster -->
    <line x1="80" y1="100" x2="220" y2="60" stroke="url(#edge-1)" class="network-edge"/>
    <line x1="220" y1="60" x2="180" y2="180" stroke="url(#edge-1)"/>
    <line x1="180" y1="180" x2="80" y2="100" stroke="url(#edge-1)" class="network-edge"/>
    <line x1="180" y1="180" x2="120" y2="300" stroke="url(#edge-1)"/>
    <line x1="120" y1="300" x2="260" y2="320" stroke="url(#edge-1)" class="network-edge"/>
    <line x1="220" y1="60" x2="340" y2="120" stroke="url(#edge-1)"/>

    <!-- Right Network cluster -->
    <line x1="1000" y1="80" x2="1120" y2="160" stroke="url(#edge-2)" class="network-edge"/>
    <line x1="1120" y1="160" x2="1040" y2="280" stroke="url(#edge-2)"/>
    <line x1="1040" y1="280" x2="920" y2="340" stroke="url(#edge-2)" class="network-edge"/>
    <line x1="920" y1="340" x2="860" y2="200" stroke="url(#edge-2)"/>
    <line x1="860" y1="200" x2="1000" y2="80" stroke="url(#edge-2)"/>
    <line x1="860" y1="200" x2="1040" y2="280" stroke="url(#edge-2)" class="network-edge"/>
  </g>

  <!-- Graph Nodes -->
  <g>
    <!-- Left Nodes -->
    <circle cx="80" cy="100" r="8" fill="#00f2fe" filter="url(#glow-cyan)" class="pulse-node"/>
    <circle cx="220" cy="60" r="12" fill="#4facfe" filter="url(#glow-cyan)" class="pulse-node-delayed"/>
    <circle cx="180" cy="180" r="6" fill="#00f2fe"/>
    <circle cx="120" cy="300" r="10" fill="#38ef7d" filter="url(#glow-cyan)" class="pulse-node"/>
    <circle cx="260" cy="320" r="7" fill="#00f2fe"/>
    <circle cx="340" cy="120" r="9" fill="#00c6ff" class="pulse-node-delayed"/>

    <!-- Right Nodes -->
    <circle cx="1000" cy="80" r="11" fill="#ff0080" filter="url(#glow-purple)" class="pulse-node-delayed"/>
    <circle cx="1120" cy="160" r="8" fill="#7928ca" filter="url(#glow-purple)" class="pulse-node"/>
    <circle cx="1040" cy="280" r="14" fill="#ff0080" filter="url(#glow-purple)" class="pulse-node"/>
    <circle cx="920" cy="340" r="7" fill="#7928ca"/>
    <circle cx="860" cy="200" r="10" fill="#f700ff" filter="url(#glow-purple)" class="pulse-node-delayed"/>
  </g>

  <!-- Center Foreground Title & Subtitle (Kept clear and bold) -->
  <g text-anchor="middle" class="float-text">
    <!-- Category Tag Badge -->
    <rect x="460" y="75" width="280" height="32" rx="16" fill="rgba(0, 242, 254, 0.1)" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="600" y="96" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="175" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="1" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Awesome Graph Database Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="225" fill="#a0aec0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0.5">
      Property Graphs • Knowledge Graphs • GraphRAG • Real-Time Analytics
    </text>

    <!-- Pill Badges -->
    <g transform="translate(360, 265)">
      <rect x="0" y="0" width="140" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="70" y="19" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600">⚡ SaaS &amp; Cloud</text>

      <rect x="170" y="0" width="140" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="240" y="19" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="600">🔓 Open-Source</text>

      <rect x="340" y="0" width="140" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="410" y="19" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="600">🤖 GraphRAG AI</text>
    </g>
  </g>
</svg>
