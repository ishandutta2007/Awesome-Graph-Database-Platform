<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0c16"/><stop offset="50%" stop-color="#121829"/><stop offset="100%" stop-color="#1a0b2e"/></linearGradient><filter id="glow-cyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-purple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><linearGradient id="edge-1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#4facfe" stop-opacity=".2"/></linearGradient><linearGradient id="edge-2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#7928ca" stop-opacity=".8"/><stop offset="100%" stop-color="#ff0080" stop-opacity=".3"/></linearGradient><style>@keyframes pulse{0%{transform:scale(1);opacity:.7}}@keyframes float{0%{transform:translateY(0)}}.bg-grid{stroke:rgba(255,255,255,.04);stroke-width:1}.network-edge{stroke-dasharray:8 4;animation:dash 30s linear infinite}.pulse-node{animation:pulse 3s ease-in-out infinite alternate}.pulse-node-delayed{animation:pulse 3s ease-in-out 1.5s infinite alternate}.float-text{animation:float 4s ease-in-out infinite alternate}</style></defs><rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/><g class="bg-grid"><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="320" y2="320"/><line x1="150" x2="150" y1="0" y2="400"/><line x1="300" x2="300" y1="0" y2="400"/><line x1="450" x2="450" y1="0" y2="400"/><line x1="600" x2="600" y1="0" y2="400"/><line x1="750" x2="750" y1="0" y2="400"/><line x1="900" x2="900" y1="0" y2="40